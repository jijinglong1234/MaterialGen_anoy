# ALD (Annealed Langevin Dynamics) Experiment Config
# Type A: Overdamped Langevin with monotonically decreasing noise

experiment:
  name: "ald_mp20"
  description: "Baseline annealed Langevin dynamics with geometric noise schedule"
  output_dir: "results/ald_mp20/"

sampler:
  type: "ald"
  sigma_max: 1.0
  sigma_min: 0.01
  num_steps: 200
  num_samples: 500
  beta: 38.68
  schedule: "geometric"        # geometric | linear | cosine
  langevin_steps_per_level: 1
  step_size: 0.2
  prior: "gaussian"

